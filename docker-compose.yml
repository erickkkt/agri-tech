version: '3.8'

# ===================================================================
# Agri-Tech monorepo - full stack orchestration
# Usage: docker compose up --build
#   - Postgres   → localhost:5432
#   - farm-api   → http://localhost:8080
#   - farm-admin → http://localhost:4200
#   - farm-user  → http://localhost:4300
#
# Both SPAs (admin + user) run nginx on port 80 inside the container
# and reverse-proxy /api/* to farm-api:8080, so the browser is
# always same-origin (no CORS configuration required).
# ===================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: agri-tech-postgres
    environment:
      - POSTGRES_DB=farm_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=dockerABC@123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agri-tech-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farm_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  farm-api:
    build:
      context: ./farm-api
      dockerfile: Dockerfile
    container_name: agri-tech-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__farmDb=Host=postgres;Port=5432;Database=farm_db;Username=postgres;Password=dockerABC@123
    ports:
      - "8080:8080"
    networks:
      - agri-tech-net

  farm-admin:
    build:
      context: ./farm-admin
      dockerfile: Dockerfile
    container_name: agri-tech-admin
    depends_on:
      - farm-api
    ports:
      - "4200:80"
    networks:
      - agri-tech-net

  farm-user:
    build:
      context: ./farm-user
      dockerfile: Dockerfile
    container_name: agri-tech-user
    depends_on:
      - farm-api
    ports:
      - "4300:80"
    networks:
      - agri-tech-net

networks:
  agri-tech-net:
    driver: bridge

volumes:
  postgres_data:
