<header class="topbar">
  <div class="topbar-inner">
    <a routerLink="/" class="brand">
      <span class="logo">🌾</span>
      <span>Agri-Tech</span>
    </a>
    <nav>
      <a routerLink="/marketplace" routerLinkActive="active">Sàn giao dịch</a>
      <a routerLink="/investments" routerLinkActive="active">Đầu tư</a>
      <a routerLink="/forum" routerLinkActive="active">Diễn đàn</a>
    </nav>
    <div class="auth">
      <ng-container *ngIf="isAuthenticated$ | async; else loginBtn">
        <span class="user-name">{{ (currentUser$ | async)?.displayName || 'Tài khoản' }}</span>
        <button class="secondary" (click)="logout()">Đăng xuất</button>
      </ng-container>
      <ng-template #loginBtn>
        <button (click)="login()">Đăng nhập</button>
      </ng-template>
    </div>
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>

<footer class="footer">
  <div class="container">
    <span>© Agri-Tech 2026 - Hệ sinh thái nông nghiệp số.</span>
  </div>
</footer>
